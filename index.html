<!DOCTYPE html>
<html lang="en" class="bg-accent1 text-accent2">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>s̷̰̃t̴̫̊r̶͔̽ả̷̜y̴̼͂l̸̙͛į̸͆g̴̘̎h̷̜̀ṭ̸͂ ̸̰̊p̵̞̅ȑ̴̙ơ̸͍t̶̗̑o̶͂͜ć̵͍ȏ̸͕l̷̗͗</title>
    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@400;600&display=swap" rel="stylesheet">
    <!-- web3/vite polyfills -->
    <script>window.global = window;</script>
    <script type="module">
        import process from "process";
        import { Buffer } from "buffer";
        import EventEmitter from "events";
        
        window.Buffer = Buffer;
        window.process = process;
        window.EventEmitter = EventEmitter;
    </script>

    <style>
      #loading svg path {
        animation: flip 5000ms linear infinite;
        transform-origin: center center;
      }
      @keyframes flip {
        0%{ transform: scale(1,1); }
        32%{ transform: scale(1,1); }
        50%{ transform: scale(-1,1) }
        82%{ transform: scale(-1,1); }
        100%{ transform: scale(1,1); }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script async defer src="/p5.min.js"></script>
  </body>
</html>
